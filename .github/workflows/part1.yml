name: Part 1 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-and-native-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify extension
        run: |
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension lint
          pnpm --dir extension compile
          pnpm --dir extension test
          pnpm --dir extension build

      - name: Install the E2E browser
        run: pnpm --dir extension exec playwright install --with-deps chromium

      - name: Verify native Rust host
        run: |
          cargo fmt --manifest-path daemon/Cargo.toml --check
          cargo clippy --manifest-path daemon/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path daemon/Cargo.toml
          cargo build --manifest-path daemon/Cargo.toml --bin secureintent-shadow-host
          node scripts/smoke-host.mjs --health
          node scripts/smoke-host.mjs testdata/block.pem block
          node scripts/smoke-host.mjs testdata/allow.txt allow

      - name: Verify install, diagnostics, and uninstall in isolation
        run: ./scripts/test-install.sh "${{ runner.temp }}/secureintent-native-host-test"

      - name: Exercise the real Chromium extension-to-Rust loop
        run: pnpm --dir extension e2e

  tauri-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xauth xvfb

      - name: Build and exercise the zero-window Tauri host
        run: |
          cargo clippy --manifest-path daemon/Cargo.toml \
            --features tauri-host --bin secureintent-shadow-tauri -- -D warnings
          cargo build --manifest-path daemon/Cargo.toml \
            --features tauri-host --bin secureintent-shadow-tauri
          xvfb-run -a env SHADOW_HOST_BINARY=daemon/target/debug/secureintent-shadow-tauri \
            node scripts/smoke-host.mjs --health
          xvfb-run -a env SHADOW_HOST_BINARY=daemon/target/debug/secureintent-shadow-tauri \
            node scripts/smoke-host.mjs testdata/block.pem block
          xvfb-run -a env SHADOW_HOST_BINARY=daemon/target/debug/secureintent-shadow-tauri \
            node scripts/smoke-host.mjs testdata/allow.txt allow

      - name: Exercise Chromium through the Tauri v2 host
        run: |
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension build
          pnpm --dir extension exec playwright install --with-deps chromium
          xvfb-run -a env \
            SHADOW_E2E_HOST_BINARY=daemon/target/debug/secureintent-shadow-tauri \
            pnpm --dir extension e2e
